name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    name: Lint & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, payment-service, inventory-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: npm run lint

      - name: Unit tests
        working-directory: ${{ matrix.service }}
        run: npm test

  docker-build:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [order-service, payment-service, inventory-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  integration-test:
    name: Multi-container integration test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Start the full stack
        run: docker compose up --build -d

      - name: Wait for services to become healthy
        run: |
          for service in order-service payment-service inventory-service; do
            echo "Waiting for $service..."
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$service" 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "$service is healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "$service did not become healthy in time"
                docker compose logs "$service"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Create an order via the REST API
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST http://localhost:3001/orders \
            -H "Content-Type: application/json" \
            -d '{"userId":"ci-user","items":[{"sku":"SKU-CI-1","name":"CI Widget","quantity":2,"price":9.99}]}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP status: $http_code"
          echo "Body: $body"
          if [ "$http_code" != "201" ]; then
            echo "Expected HTTP 201 from POST /orders, got $http_code"
            exit 1
          fi
          order_id=$(echo "$body" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).orderId')
          echo "order_id=$order_id" >> "$GITHUB_ENV"

      - name: Verify the order can be retrieved
        run: |
          sleep 3
          curl -sf "http://localhost:3001/orders/${order_id}" | tee /dev/stderr | grep -q '"status":"CREATED"'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
